name: Go CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 1. Lint Job: Checks code quality and formatting
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.1
  # 2. Test and Build Job: Runs unit tests and builds the executable
  test-and-build:
    name: Test and Build
    needs: lint # Only run if linting passes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true # Enables automatic caching of Go modules and build caches

      - name: Install Dependencies
        run: go mod download

      - name: Run Tests
        run: go test -v -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Build Binary
        run: env CGO_ENABLED=0 go build -v -o my-app ./cmd/sub/main.go
